method:
  name: dann
  classification_loss_weight: 1.0
  uses_unlabeled_target: true
  domain_loss_weight: 1.0
  gradient_reversal_maximum: 1.0
  gradient_reversal_gamma: 10.0
  discriminator_hidden_dimension: 256
  discriminator_dropout: 0.5

training:
  use_automatic_mixed_precision: false
  gradient_clip_norm: 5.0
